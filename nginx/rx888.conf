server {
    listen 18081 ssl;
    server_name rx888.hb9vqq.ch;

    ssl_certificate     /etc/letsencrypt/live/rx888.hb9vqq.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rx888.hb9vqq.ch/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    error_page 497 =301 https://$host:8081$request_uri;

    location /api/rmnoise/ {
        proxy_pass http://127.0.0.1:9374;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_buffering off;
    }
}

